[package]
name = "agent-plugins-wasm"
description = "agent-plugins compiled to WebAssembly: the registry's `call` behind a small ABI, JSON in and out through linear memory, for the npm package's wrapper and any language with a WebAssembly runtime"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# `cdylib` is the .wasm the npm package loads; `rlib` lets the tests call the same functions
# natively.
[lib]
crate-type = ["cdylib", "rlib"]

# No wasm-bindgen: three exported functions and JSON in linear memory need no glue generator,
# and the module stays free of its runtime and its generated JavaScript; any language that can
# call a WebAssembly function with integers can use it.
[dependencies]
agent-plugins = { path = "../agent-plugins" }

# The workspace's lints, copied because one differs: an exported function is `#[no_mangle]` and
# a buffer handed back from the host is rebuilt from its pointer, which `unsafe_code = "forbid"`
# cannot allow. Here it is `deny`, and `src/abi.rs`, the one module that needs it, is an
# `expect` with its reason.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
# The tightest visibility that compiles: `pub` only for what another crate uses.
unreachable_pub = "deny"
unused_qualifications = "deny"

[lints.clippy]
# A panic is a bug (RS4): a plugin's files are input, never a reason to crash the host. No unwrap,
# expect, panic or unreachable in working code.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
# A string sliced inside a character panics.
string_slice = "deny"
# A number cut short by `as` is a silent bug: `try_from`, or a reason.
cast_possible_truncation = "deny"
# A library prints nothing and never ends the process.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mem_forget = "deny"
# The crate does no I/O and reads no ambient state (RS3); the list is in clippy.toml.
disallowed_methods = "deny"
disallowed_types = "deny"
# Small functions, as small files (RS5): at most 100 lines, a bounded complexity.
too_many_lines = "deny"
cognitive_complexity = "deny"
# Explicit where it matters.
clone_on_ref_ptr = "deny"
redundant_clone = "deny"
match_wildcard_for_single_variants = "deny"
# Our own enums are matched exhaustively: a variant added is placed in every match, never
# swallowed by a `_`.
wildcard_enum_match_arm = "deny"
wildcard_imports = "deny"
unused_self = "deny"
# Rust's anti-patterns: a lost error cause, a cast that changes sign, flags instead of a state.
map_err_ignore = "deny"
unwrap_in_result = "deny"
unused_result_ok = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
option_option = "deny"
unnecessary_wraps = "deny"
needless_collect = "deny"
format_collect = "deny"
# `write!` into the String, not a `format!` allocated to be appended.
format_push_string = "deny"
# A default built only when it is needed: `unwrap_or_else`, `map_or_else`, `or_else`.
or_fun_call = "deny"
# A method that returns a changed copy is `#[must_use]`: dropping the copy loses the change.
return_self_not_must_use = "deny"
# A clone into a value already there reuses its allocation: `clone_from`.
assigning_clones = "deny"
# Primitives sort unstably: equal ones cannot be told apart, and it needs no buffer.
stable_sort_primitive = "deny"
# One module layout: `x.rs` beside its directory `x/`, never `x/mod.rs` (RS5).
mod_module_files = "deny"
# What a function only reads it borrows; a value it takes it keeps, or moves on.
needless_pass_by_value = "deny"
# A struct is all public, or its fields say how far they reach.
partial_pub_fields = "deny"
iter_over_hash_type = "deny"
fallible_impl_from = "deny"
try_err = "deny"
get_unwrap = "deny"
verbose_file_reads = "deny"
lossy_float_literal = "deny"
mixed_read_write_in_expression = "deny"
infinite_loop = "deny"
empty_drop = "deny"
error_impl_error = "deny"
panic_in_result_fn = "deny"
rest_pat_in_fully_bound_structs = "deny"
trivially_copy_pass_by_ref = "deny"
large_types_passed_by_value = "deny"
inefficient_to_string = "deny"
implicit_clone = "deny"
# A lint set aside says why, and is an `expect`: an exemption that no longer applies fails the
# build, so none outlives its reason.
allow_attributes_without_reason = "deny"
allow_attributes = "deny"

# Whether the spec has moved past the revision spec/SOURCE.json pins (AGENTS.md, E7): fails while
# the pin is behind the spec's main, so a newer spec is never noticed late. A red run means
# catching up (docs/RUST.md, "When the spec moves"), not rerunning.
name: Spec behind

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  behind:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run spec:behind
        env:
          GH_TOKEN: ${{ github.token }}

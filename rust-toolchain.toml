# The latest stable Rust for the core in crates/agent-plugins: it builds on any stable from its
# rust-version (Cargo.toml) on. The wasm target is the npm package's (crates/agent-plugins-wasm).
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
